<script>
  function solution(record) {
    var answer = [];
    let users = {}; // uid 기준으로 저장할 딕셔너리

    // let arr = Array.from(Array(record.length), () => new Array(3))
    for (let i = 0; i<record.length; i++) {
      const[action, uid, nickname] = record[i].split(" ");
      
      if(action === "Enter" || action === "Change") {
        users[uid] = nickname;
      }
    }
    // console.log(users)

    for (let j=0; j<record.length; j++) {
      const[action, uid] = record[j].split(" ");

      switch (action) {
        case "Enter":
          answer.push(`${users[uid]}님이 들어왔습니다.`);
          break;
        case "Leave":
          answer.push(`${users[uid]}님이 나갔습니다.`);
          break;
        default:
          break;
        
      }
    }
    // console.log(answer)
    return answer;
  }

  solution(["Enter uid1234 Muzi", "Enter uid4567 Prodo","Leave uid1234","Enter uid1234 Prodo","Change uid4567 Ryan"])
</script>
