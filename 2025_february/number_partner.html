<script>
  function solution(X, Y) {
    // 문자열로 변환하여 저장
    X = String(X);
    Y = String(Y);

    // 결과값이 될 변수
    let result = '';
    // X의 문자열 내 공통된 숫자 수 저장할 배열(0~9)
    let count = new Array(10).fill(0);

    // 순회하며 공통된 수 카운트하여 입력
    for(let num of X) count[num]++;

    // 공통된 수 카운트할 새로운 배열 생성
    const common_cnt = new Array(10).fill(0);
    
    // Y의 문자열 내에서 순회하며 
    for(const num of Y) {
        // 만약 X 배열 내 해당 수 count가 있다면
        if(count[num]>0){
        common_cnt[num]++; // 공통 해당 수 카운트 올리고
        count[num]--; // X의 해당 수 카운트 수 줄임
      }
    }

    // 가장 큰 수를 만들기 위해 큰 수의 카운트부터 확인
    for(let i=9; i>=0; i--){
      if(common_cnt[i] > 0) {
        // 결과값 변수에 문자열로 카운트만큼 반복해서 붙인다
        result += String(i).repeat(common_cnt[i]);
      }
    }

    // 만약 빈 문자열이면 -1 리턴
    if(result === '') return '-1';
    // 가장 큰 수가 0일때 나머지도 0이므로 0 리턴
    if(result[0] === '0') return '0';

    return result;
  }
  console.log(solution(100, 203045))
  console.log(solution(3403, 13203));


</script>
